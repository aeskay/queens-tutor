[build]
  command = "npm run build"
  publish = "dist"

[dev]
  port = 8889

[[edge_functions]]
  path = "/.netlify/functions/generate-lessons"
  function = "generate-lessons"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions.generate-lessons]
  timeout = 90

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
